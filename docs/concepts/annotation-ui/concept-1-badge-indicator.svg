<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 760" font-size="16">
  <rect x="0" y="0" width="1500" height="760" fill="#ffffff"/>
  <style>
    .task { fill: #fffdf5; stroke: #333; stroke-width: 2; rx: 10; }
    .task-sel { fill: #fffdf5; stroke: #1a66ff; stroke-width: 3; stroke-dasharray: 2 3; rx: 10; }
    .badge { fill: #ffffff; stroke: #333; stroke-width: 1.5; }
    .badge-text { fill: #222; font-size: 13px; font-weight: bold; }
    .panel { fill: #f5f5f5; stroke: #555; stroke-width: 1.5; stroke-dasharray: 3 3; }
    .field { fill: none; stroke: #999; stroke-width: 1.2; }
    .btn { fill: #e8e8e8; stroke: #666; stroke-width: 1.2; }
    .caption { fill: #222; font-size: 15px; }
    .step-label { fill: #444; font-size: 13px; font-style: italic; }
    .arrow { stroke: #333; stroke-width: 2; marker-end: url(#arrowhead); fill: none; }
    .title { fill: #111; font-size: 20px; font-weight: bold; }
    .note { fill: #555; font-size: 12px; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#333"/>
    </marker>
  </defs>

  <!-- ===== Row 1: states none / one / many ===== -->
  <text x="20" y="90" class="caption" font-weight="bold">Zustände am Element:</text>

  <!-- state: none -->
  <rect x="20" y="105" width="180" height="80" class="task"/>
  <text x="110" y="150" text-anchor="middle" class="caption">Task A</text>
  <text x="110" y="205" text-anchor="middle" class="step-label">ohne Annotation: kein Badge</text>

  <!-- state: one -->
  <rect x="260" y="105" width="180" height="80" class="task"/>
  <text x="350" y="150" text-anchor="middle" class="caption">Task B</text>
  <rect x="415" y="94" width="50" height="22" rx="11" class="badge"/>
  <text x="440" y="109" text-anchor="middle" class="badge-text">MT+1</text>
  <text x="350" y="205" text-anchor="middle" class="step-label">eine Annotation: Badge "MT+1"</text>

  <!-- state: many -->
  <rect x="500" y="105" width="180" height="80" class="task"/>
  <text x="590" y="150" text-anchor="middle" class="caption">Task C</text>
  <rect x="655" y="94" width="50" height="22" rx="11" class="badge"/>
  <text x="680" y="109" text-anchor="middle" class="badge-text">MT+3</text>
  <text x="590" y="205" text-anchor="middle" class="step-label">mehrere Annotationen: Badge "MT+n"</text>

  <!-- collision / small zoom note -->
  <rect x="740" y="105" width="180" height="80" class="task"/>
  <text x="830" y="140" text-anchor="middle" class="caption">Task D</text>
  <text x="830" y="160" text-anchor="middle" font-size="11" fill="#999">(Zoom &lt; Schwellwert)</text>
  <text x="830" y="205" text-anchor="middle" class="step-label">Badge ausgeblendet,</text>
  <text x="830" y="222" text-anchor="middle" class="step-label">Panelzugang bleibt</text>

  <!-- ===== Row 3: notes ===== -->
  <text x="35" y="520" class="note" font-size="13">• Daten ausschließlich aus mt: unter bpmn:extensionElements; BPMN-Core und DI bleiben unverändert.</text>
  <text x="35" y="542" class="note" font-size="13">• Aktualisierung bei Import, Hinzufügen, Ändern, Undo/Redo, Entfernen (Vorbild: bpmn-js-bpmnlint Linting.js aktualisiert Overlays analog).</text>
  <text x="35" y="564" class="note" font-size="13">• Tastaturzugang und Screenreader-Beschriftung notwendig; Hover allein reicht laut WCAG 4.1.2 nicht aus.</text>
  <text x="35" y="586" class="note" font-size="13">• Keine automatische Kollisionsvermeidung: Labels, Linien, andere Badges, Kontextmenüs beachten; bei Platzmangel Badge ausblenden, Panel bleibt erreichbar.</text>
  <text x="35" y="608" class="note" font-size="13">• Badge als Custom-SVG-Renderer (BaseRenderer, wie bpmn-js-task-priorities ColorRenderer.js) statt HTML-Overlay – dadurch Teil des normalen SVG-Exports.</text>
  <text x="35" y="630" class="note" font-size="13">• HL7 Field Guide S. 26: die native BPMN/DMN-"Annotation" ist nur erläuternder Text ohne Ausführungsbezug – unser Badge ist ein eigenes UI-Element, keine bpmn:TextAnnotation.</text>
  <text x="35" y="652" class="note" font-size="13">• HL7 Field Guide S. 15–16: klinisches Personal liest BPMN-Diagramme mit minimalem Training – spricht für ein ruhiges, wenig überladenes Diagramm.</text>
  <text x="35" y="674" class="note" font-size="13">• Offene Frage: Darstellung bei sehr vielen annotierten Elementen gleichzeitig; ggf. ergänzende Terminologieübersicht (siehe Entwurf 2) als Zweitzugang.</text>
</svg>
