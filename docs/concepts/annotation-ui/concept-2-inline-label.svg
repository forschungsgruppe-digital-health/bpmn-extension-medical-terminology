<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="16">
  <style>
    .task { fill: #fffdf5; stroke: #333; stroke-width: 2; rx: 10; }
    .task-sel { fill: #fffdf5; stroke: #1a66ff; stroke-width: 3; stroke-dasharray: 2 3; rx: 10; }
    .inline-label { fill: #eaf6ea; stroke: #2f7a2f; stroke-width: 1.3; }
    .inline-text { fill: #184d18; font-size: 12px; }
    .panel { fill: #f5f5f5; stroke: #555; stroke-width: 1.5; stroke-dasharray: 3 3; }
    .field { fill: none; stroke: #999; stroke-width: 1.2; }
    .btn { fill: #e8e8e8; stroke: #666; stroke-width: 1.2; }
    .caption { fill: #222; font-size: 15px; }
    .step-label { fill: #444; font-size: 13px; font-style: italic; }
    .arrow { stroke: #333; stroke-width: 2; marker-end: url(#arrowhead2); fill: none; }
    .title { fill: #111; font-size: 20px; font-weight: bold; }
    .note { fill: #555; font-size: 12px; }
  </style>
  <defs>
    <marker id="arrowhead2" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#333"/>
    </marker>
  </defs>

  <text x="20" y="30" class="title">Entwurf 2: Sichtbarer Kurzinhalt am Element</text>
  <text x="20" y="50" class="note">Pen-and-Paper-Skizze, kein finales UI. Diagramm zeigt zusätzlich einen Ausschnitt des Inhalts.</text>

  <!-- ===== Row 1: states none / one / many ===== -->
  <text x="20" y="90" class="caption" font-weight="bold">Zustände am Element:</text>

  <!-- state: none -->
  <rect x="20" y="105" width="180" height="80" class="task"/>
  <text x="110" y="150" text-anchor="middle" class="caption">Task A</text>
  <text x="110" y="205" text-anchor="middle" class="step-label">ohne Annotation: kein Label</text>

  <!-- state: one -->
  <rect x="260" y="105" width="180" height="80" class="task"/>
  <text x="350" y="140" text-anchor="middle" class="caption">Task B</text>
  <rect x="270" y="155" width="160" height="20" class="inline-label"/>
  <text x="350" y="169" text-anchor="middle" class="inline-text">SNOMED: Beispielterm</text>
  <text x="350" y="205" text-anchor="middle" class="step-label">eine Annotation: Kurzlabel</text>

  <!-- state: many -->
  <rect x="500" y="105" width="180" height="80" class="task"/>
  <text x="590" y="140" text-anchor="middle" class="caption">Task C</text>
  <rect x="510" y="155" width="160" height="20" class="inline-label"/>
  <text x="590" y="169" text-anchor="middle" class="inline-text">Beispielterm +2</text>
  <text x="590" y="205" text-anchor="middle" class="step-label">mehrere: Erster Term + Zähler</text>

  <!-- dense / small zoom collision -->
  <rect x="740" y="105" width="180" height="80" class="task"/>
  <text x="830" y="135" text-anchor="middle" class="caption">Task D</text>
  <rect x="750" y="150" width="160" height="16" class="inline-label"/>
  <text x="830" y="162" text-anchor="middle" class="inline-text" font-size="10">Beisp… (gekürzt)</text>
  <text x="830" y="205" text-anchor="middle" class="step-label">dicht/klein: Text gekürzt,</text>
  <text x="830" y="222" text-anchor="middle" class="step-label">volle Angabe im Panel</text>

  <!-- ===== Row 2: flow ===== -->
  <text x="20" y="270" class="caption" font-weight="bold">Ablauf: Hinzufügen, Anzeigen, Ändern, Entfernen</text>

  <!-- Step 1: select element -->
  <rect x="20" y="290" width="150" height="70" class="task-sel"/>
  <text x="95" y="330" text-anchor="middle" class="caption">Task</text>
  <text x="95" y="375" text-anchor="middle" class="step-label">1. Element auswählen</text>

  <path d="M175,325 L215,325" class="arrow"/>

  <!-- Step 2: panel add -->
  <rect x="220" y="285" width="190" height="130" class="panel"/>
  <text x="235" y="305" class="caption" font-size="13">Eigenschaftenpanel</text>
  <rect x="235" y="315" width="160" height="14" class="field"/>
  <text x="240" y="326" font-size="10" fill="#777">System</text>
  <rect x="235" y="335" width="160" height="14" class="field"/>
  <text x="240" y="346" font-size="10" fill="#777">Code</text>
  <rect x="235" y="355" width="160" height="14" class="field"/>
  <text x="240" y="366" font-size="10" fill="#777">Display</text>
  <rect x="235" y="378" width="60" height="20" class="btn"/>
  <text x="265" y="392" text-anchor="middle" font-size="11">Speichern</text>
  <text x="315" y="375" text-anchor="middle" class="step-label" font-size="12">2. Annotation</text>
  <text x="315" y="455" text-anchor="middle" class="step-label">anlegen</text>

  <path d="M415,350 L455,350" class="arrow"/>

  <!-- Step 3: inline label appears -->
  <rect x="460" y="290" width="150" height="70" class="task"/>
  <text x="535" y="320" text-anchor="middle" class="caption">Task</text>
  <rect x="465" y="330" width="140" height="18" class="inline-label"/>
  <text x="535" y="343" text-anchor="middle" class="inline-text" font-size="10">Beispielterm</text>
  <text x="535" y="390" text-anchor="middle" class="step-label">3. Kurzlabel</text>
  <text x="535" y="405" text-anchor="middle" class="step-label">erscheint am Element</text>

  <path d="M615,325 L655,325" class="arrow"/>

  <!-- Step 4: select label/element to open full detail -->
  <rect x="660" y="290" width="150" height="70" class="task-sel"/>
  <text x="735" y="320" text-anchor="middle" class="caption">Task</text>
  <rect x="665" y="330" width="140" height="18" class="inline-label" stroke="#1a66ff" stroke-width="2"/>
  <text x="735" y="343" text-anchor="middle" class="inline-text" font-size="10">Beispielterm</text>
  <text x="735" y="390" text-anchor="middle" class="step-label">4. Klick / Tastatur</text>
  <text x="735" y="405" text-anchor="middle" class="step-label">öffnet volle Details</text>

  <path d="M815,325 L855,325" class="arrow"/>

  <!-- Step 5: panel details/edit/remove -->
  <rect x="860" y="280" width="130" height="150" class="panel"/>
  <text x="875" y="298" class="caption" font-size="13">Details</text>
  <text x="875" y="316" font-size="11" fill="#333">System: SNOMED CT</text>
  <text x="875" y="332" font-size="11" fill="#333">Code: 71388002</text>
  <text x="875" y="348" font-size="11" fill="#333">Display: Beispielterm</text>
  <rect x="875" y="358" width="50" height="18" class="btn"/>
  <text x="900" y="371" text-anchor="middle" font-size="10">Ändern</text>
  <rect x="930" y="358" width="50" height="18" class="btn"/>
  <text x="955" y="371" text-anchor="middle" font-size="10">Entfernen</text>
  <text x="925" y="405" text-anchor="middle" class="step-label" font-size="12">5. Vollständige Details,</text>
  <text x="925" y="420" text-anchor="middle" class="step-label" font-size="12">Bearbeiten, Entfernen</text>

  <!-- ===== Row 3: notes ===== -->
  <rect x="20" y="470" width="960" height="260" fill="none" stroke="#ccc" stroke-dasharray="4 4"/>
  <text x="35" y="495" class="caption" font-weight="bold">Anmerkungen (aus Recherche und Issue #17)</text>
  <text x="35" y="520" class="note" font-size="13">• Inhalt im Diagramm unmittelbar sichtbar – erfüllt HL7-Hinweis (S. 82), dass annotierte Konzepte erkennbar mit ihrer Terminologie/Kategorie verknüpft sein sollen.</text>
  <text x="35" y="542" class="note" font-size="13">• Risiko: bei dichten Diagrammen und vielen Annotationen überlagern sich Kurzlabels mit Sequenzflüssen, anderen Labels und Kontextmenüs.</text>
  <text x="35" y="564" class="note" font-size="13">• Bei kleinem Zoom muss der Text gekürzt oder ausgeblendet werden (vgl. Entwurf 1, Task D); Zugriff auf volle Angabe bleibt über das Panel erhalten.</text>
  <text x="35" y="586" class="note" font-size="13">• Tastaturzugang und Screenreader-Beschriftung weiterhin nötig; Hover allein reicht laut WCAG 4.1.2 nicht aus.</text>
  <text x="35" y="608" class="note" font-size="13">• Als SVG-Grafik im aktiven Diagrammlayer grundsätzlich exportierbar (im Gegensatz zu HTML-Overlays aus Entwurf 1) – muss aber gezielt getestet werden.</text>
  <text x="35" y="630" class="note" font-size="13">• HL7 Field Guide S. 26: die native BPMN/DMN-"Annotation" ist nur erläuternder Text – unser Kurzlabel ersetzt sie nicht und bleibt rein visuelle Projektion aus term:-Daten.</text>
  <text x="35" y="652" class="note" font-size="13">• HL7 Field Guide S. 15–16: BPMN soll mit minimalem Training lesbar bleiben – zusätzlicher Text am Element erhöht die Informationsdichte stärker als Entwurf 1.</text>
  <text x="35" y="674" class="note" font-size="13">• Offene Frage: Kürzungsregel für lange Display-Namen und Reihenfolge bei mehreren Annotationen am selben Element.</text>
</svg>
