name: deploy-site

# Publishes one GitHub Pages site containing three things that are built
# separately and assembled into a single directory:
#
#   /        the documentation site (Astro + Starlight)
#   /api/    the API reference, generated from the source by TypeDoc
#   /demo/   the interactive bpmn-js demo
#
# GitHub Pages accepts exactly one artifact per deployment, so the assembly
# step is not an optimisation — two upload-pages-artifact calls cannot both be
# published.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag to publish. Use this to preview a branch before merging.'
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  SITE_BASE: /bpmn-extension-medical-terminology/

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run tests
        run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm

      - name: Install package dependencies
        run: npm ci --legacy-peer-deps

      - name: Install documentation site dependencies
        run: npm ci --prefix docs-site

      - name: Build documentation site
        run: npm run docs:build

      - name: Build demo application
        env:
          BASE_PATH: ${{ env.SITE_BASE }}demo/
          BUILD_SOURCEMAP: 'false'
        run: npm run build

      - name: Assemble the published tree
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R docs-site/dist/. _site/
          mkdir -p _site/demo
          cp -R demo/dist/. _site/demo/
          echo "Assembled $(find _site -type f | wc -l) files, $(du -sh _site | cut -f1)."

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
