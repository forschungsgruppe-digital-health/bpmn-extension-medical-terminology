name: release-please

on:
  push:
    branches:
      - main

# release-please maintains the release PR and tags releases. Publishing is
# DECOUPLED into publish.yml (triggered `on: release: published`) so that a
# created release reliably pushes the packages to GitHub Packages, independent of
# release-please's release-creation step.
permissions:
  contents: write # create tags + GitHub Releases, commit version bumps
  pull-requests: write # open/update the release PR

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs['extension--release_created'] }}
      tag_name: ${{ steps.release.outputs['extension--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  npm-stage:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/npm-stage.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
