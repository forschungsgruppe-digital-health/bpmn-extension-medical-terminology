name: release-please

on:
  push:
    branches:
      - main

# release-please maintains the release PR and tags releases. Publishing is
# DECOUPLED into publish.yml (triggered `on: release: published`) so that a
# created release reliably pushes the packages to GitHub Packages, independent of
# release-please's release-creation step.
permissions:
  contents: write # create tags + GitHub Releases, commit version bumps
  pull-requests: write # open/update the release PR

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
