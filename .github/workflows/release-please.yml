name: release-please

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      smoke_tag:
        description: Existing RC release tag to use for publisher validation
        required: true
        type: string
      test_version:
        description: Temporary RC version to stage and then reject
        required: true
        type: string

# release-please maintains the release PR and tags releases.
# Stable GitHub publishing stays in publish.yml. Only RC releases are staged on npm.
permissions:
  contents: write # create tags + GitHub Releases, commit version bumps
  pull-requests: write # open/update the release PR

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs['extension--release_created'] }}
      tag_name: ${{ steps.release.outputs['extension--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  npm-stage:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' && contains(needs.release-please.outputs.tag_name, '-rc.')
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/npm-stage.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets:
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

  npm-stage-smoke:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/npm-stage.yml
    with:
      tag: ${{ inputs.smoke_tag }}
      test_version: ${{ inputs.test_version }}
