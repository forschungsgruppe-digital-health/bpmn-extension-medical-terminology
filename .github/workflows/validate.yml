name: validate

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24]

    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint BPMN and terminology rules
        run: npm run lint:bpmn

      - name: Reject invalid BPMN fixtures
        run: |
          if npm run lint:invalid; then
            echo "::error::invalid examples unexpectedly passed lint"
            exit 1
          fi

      - name: Run tests
        run: npm test

      - name: Build demo app
        run: npm run build

  conformance:
    name: BPMN conformance & conventions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Ensure xmllint is available (for XSD core validation)
        run: |
          if command -v xmllint >/dev/null 2>&1; then
            xmllint --version
            exit 0
          fi

          # GitHub-hosted images can contain third-party APT repositories with
          # stale indexes. Refresh only Ubuntu sources so an unrelated mirror
          # cannot prevent installing the XSD validator.
          sudo apt-get update \
            -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources \
            -o Dir::Etc::sourceparts=/dev/null \
            -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends libxml2-utils

      # Blocking gate: structural BPMN lint + lossless/stable moddle roundtrip +
      # informational XSD core validation. (XSD is informational by design — the
      # standard BPMN20.xsd cannot validate extension content; see the tools.)
      - name: Conformance (bpmnlint + roundtrip + XSD)
        run: npm run check:conformance

      # Blocking gate: npm/bpmn.io packaging conventions for the workspace packages.
      - name: Package conventions
        run: npm run check:packages

      # Blocking gate: no high/critical CVEs in *production* (shipped) dependencies.
      # Dev-only advisories are tracked separately and do not block here. The
      # upstream npm package named hl7.fhir.r4.core is malicious (GHSA-qg8x-2hq5-hwf3),
      # but this project obtains a data-only FHIR package with that name from
      # Simplifier, pinned by the lockfile integrity hash. npm audit cannot
      # distinguish the registry source, so this one false positive is removed
      # before enforcing the blocking threshold.
      - name: Dependency audit (production deps)
        run: |
          npm audit --omit=dev --audit-level=high --json > audit.json || true
          node -e '
            const fs = require("fs");
            const audit = JSON.parse(fs.readFileSync("audit.json", "utf8"));
            const allowed = "GHSA-qg8x-2hq5-hwf3";
            const core = audit.vulnerabilities?.["hl7.fhir.r4.core"];
            const lockfile = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
            const coreResolution = lockfile.packages?.["node_modules/hl7.fhir.r4.core"]?.resolved;
            const affected = new Set(["hl7.fhir.r4.core", ...(core?.effects || [])]);
            const isOnlyAllowedFinding = core?.via?.length === 1 &&
              core.via[0]?.url?.includes(allowed) &&
              [...affected].filter(name => name !== "hl7.fhir.r4.core").every(name => (audit.vulnerabilities[name]?.via || []).every(
                entry => typeof entry === "string" && affected.has(entry)
              ));
            if (
              isOnlyAllowedFinding &&
              coreResolution === "https://packages.simplifier.net/hl7.fhir.r4.core/4.0.1"
            ) {
              for (const name of affected) {
                delete audit.vulnerabilities[name];
              }
            }
            const remaining = Object.values(audit.vulnerabilities || {}).filter(v =>
              v.severity === "high" || v.severity === "critical"
            );
            if (remaining.length) {
              console.error(JSON.stringify(remaining, null, 2));
              process.exit(1);
            }
          '
