# Dependabot version updates.
#
# Changes land through pull requests into dev, so every version update
# targets dev. Dependabot reads this file from the default branch (main), so
# it takes effect once dev is promoted to main. Security updates always
# target the default branch and are not delayed by the cooldown.
#
# The cooldown keeps the repository's 14-day rule: a release is only
# proposed once it is at least 14 days old. Minor and patch updates are
# grouped per ecosystem; major updates arrive as individual pull requests
# because each needs its own review.
version: 2

updates:
  # Root npm workspaces: extension, demo and the bpmnlint plugin. The root
  # .npmrc sets legacy-peer-deps, so lockfile updates resolve like CI.
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # FHIR terminology packages are tarball URLs on packages.simplifier.net.
      # They are updated deliberately, together with the generated terminology
      # data (npm run generate:hl7).
      - dependency-name: hl7.terminology.r4
      - dependency-name: hl7.fhir.r4.core
      - dependency-name: hl7.fhir.uv.extensions.r4
      - dependency-name: dvmd.kdl.r4
      - dependency-name: de.ihe-d.terminology
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
        exclude-patterns:
          # 0.x: a minor release can break, and TypeDoc moves with its plugins.
          - typedoc
          - typedoc-*

  # Documentation site: installed separately with `npm run docs:install`.
  - package-ecosystem: npm
    directory: /docs-site
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    commit-message:
      prefix: chore
      include: scope
    groups:
      docs-site-minor-and-patch:
        update-types: [minor, patch]
        exclude-patterns:
          # 0.x: a minor release can break, so these get their own pull requests.
          - "@astrojs/starlight"
          - starlight-typedoc
          - typedoc
          - typedoc-*

  # GitHub Actions in .github/workflows, pinned by commit SHA with the
  # release in a trailing comment. Dependabot updates both together.
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns: ["*"]
